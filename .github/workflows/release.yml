# Release pipeline. Trigger: push a v* tag.
#
# Produces a DRAFT GitHub release containing:
#   Windows NSIS .exe · macOS universal .dmg · Linux .deb/.rpm/.AppImage
#   latest.json (updater manifest) + per-asset .sig  (once M7 enables
#   createUpdaterArtifacts + the signing secrets)
#   SHA256SUMS + Sigstore build-provenance attestations
# The maintainer reviews the draft and publishes manually — publishing is
# what makes latest.json visible to auto-updaters.
#
# Secrets (created during M7's key ceremony):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04 # oldest glibc for AppImage compatibility
            args: ''
            rust-targets: ''
          - os: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    # Actions are pinned to commit SHAs: this workflow holds the updater
    # signing key, so a retargeted upstream tag must not be able to run new
    # code here. Bump the SHAs deliberately, alongside the version comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every tagged release carries a short changelog: the `## [X.Y.Z]`
      # section of CHANGELOG.md. It goes on top of the release notes, and a
      # tag without one fails here, before anything is built.
      - name: Read this version's changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v head="## [$VERSION]" '
            /^## \[/ { on = (index($0, head) == 1); next }
            on { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section — write the changelog before tagging."
            exit 1
          fi
          { echo 'body<<CHANGELOG_EOF'; printf '%s\n' "$NOTES"; echo 'CHANGELOG_EOF'; } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux webview dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      # whisper-rs (offline voice notes) builds whisper.cpp with CMake and
      # generates its bindings with libclang — same steps as ci.yml.
      - name: Install libclang (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y cmake libclang-dev
      - name: Point bindgen at LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
        shell: bash
      # Xcode's own toolchain, not brew's: `brew --prefix llvm` answers with a
      # prefix even when the formula is not installed, and the runner images
      # stopped shipping it — bindgen then died on "Unable to find libclang".
      - name: Point bindgen at LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIB/libclang.dylib" || { echo "::error::no libclang.dylib in $LIB"; exit 1; }
          echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
      # The Vulkan backend (Windows/Linux) compiles its shaders with glslc
      # from the Vulkan SDK at build time; the app itself needs only the
      # platform's Vulkan loader (delay-loaded on Windows). macOS uses Metal
      # and needs nothing extra.
      # LunarG's own silent install, not a third-party action: the action
      # unpacks the installer with 7-Zip, and the current SDK's installer
      # yields only bin/ that way — CMake's FindVulkan then fails on the
      # missing Include/ and Lib/. `--root` keeps the SDK path short.
      - name: Install Vulkan SDK (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP/vulkan_sdk.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $exe
          $sdkArgs = @('--root', 'C:/VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          Start-Process -FilePath $exe -ArgumentList $sdkArgs -NoNewWindow -Wait
          foreach ($f in 'Bin/glslc.exe', 'Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib') {
            if (-not (Test-Path "C:/VulkanSDK/$f")) { throw "Vulkan SDK install is missing $f" }
          }
          "VULKAN_SDK=C:/VulkanSDK" >> $env:GITHUB_ENV
          "C:/VulkanSDK/Bin" >> $env:GITHUB_PATH
      # jammy has no `glslc` package (it arrives in 24.04), so glslc comes from
      # LunarG's own apt repo; the loader and headers still come from Ubuntu.
      - name: Install Vulkan headers + glslc (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          KEY=https://packages.lunarg.com/lunarg-signing-key-pub.asc
          LIST=https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          wget -qO- "$KEY" | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list "$LIST"
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-headers shaderc
          glslc --version
          test -f /usr/include/vulkan/vulkan.h
      # The shader generator is a nested CMake project ~150 characters deep
      # inside the target dir; MSVC's build tooling still stops at MAX_PATH,
      # so Windows builds from a short target dir (see README "Build notes").
      - name: Short target dir (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "CARGO_TARGET_DIR=D:\t" >> "$GITHUB_ENV"
        shell: bash

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action substitutes the app version
          releaseName: 'MD Specpad v__VERSION__'
          # The per-platform download table is NOT here: `finalize` prepends one
          # with real links, because only that job knows the built filenames.
          # If it never runs, the notes below still stand on their own.
          # First-run notes lead the template so they land directly under that
          # table and above "What's new".
          releaseBody: |
            **Linux**: take the `.AppImage` (any distro), `.deb` or `.rpm` from Assets below.

            **First-run notes**
            - **Windows**: SmartScreen may warn because the app isn't signed with a paid certificate — click *More info → Run anyway*.
            - **macOS**: right-click the app → *Open* the first time (Gatekeeper).
            - **Linux AppImage**: `chmod +x` the file, then run it.

            The app updates itself automatically after this install.

            ## What's new

            ${{ steps.changelog.outputs.body }}

            <details>
            <summary>Other files (you don't need these)</summary>

            `SHA256SUMS`, `latest.json`, and `*.sig` support checksum verification and the built-in auto-updater. See the README for how to verify downloads.
            </details>
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Android APK. Runs after `build` so the draft release already exists and
  # the APK can be uploaded to it directly with gh (draft releases are
  # resolvable by tag via the API).
  #
  # Signing secrets (create the upload keystore locally, then add):
  #   ANDROID_KEYSTORE_B64      — base64 of the .jks upload keystore
  #   ANDROID_KEY_ALIAS         — key alias
  #   ANDROID_KEY_PASSWORD      — key + store password
  # Without them the job still runs but produces an UNSIGNED apk, which is
  # uploaded with an explicit -unsigned name so nobody ships it by accident.
  android:
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      # secrets.* is not usable in step `if:`, so mirror it into env.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Install cmake + libclang (whisper-rs bindings)
        run: sudo apt-get install -y cmake libclang-dev

      # whisper-rs-sys builds whisper.cpp with CMake even for `cargo check`,
      # so the NDK compilers are needed for real here, not just as a probe.
      # Deliberately NOT the NDK's android.toolchain.cmake: that file picks its
      # own default ABI (armeabi-v7a) unless ANDROID_ABI is passed as a CMake
      # argument, which the cmake crate offers no env hook for — the v0.8.0 APK
      # got 32-bit whisper objects for every ABI and failed to link with
      # "incompatible with aarch64linux". Without it the cmake crate sets
      # CMAKE_SYSTEM_NAME=Android and CMAKE_SYSTEM_PROCESSOR per target and
      # CMake derives the right ABI. bindgen separately needs the NDK sysroot
      # and the target triple, or it reads the HOST headers and silently falls
      # back to whisper-rs-sys's prebuilt 64-bit bindings.
      - name: Export NDK toolchain env
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          API=24
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # <rust target>:<clang prefix> — armv7's compiler wrapper is spelled
          # armv7a-linux-androideabi, not armv7-linux-androideabi.
          for abi in aarch64-linux-android:aarch64-linux-android \
            armv7-linux-androideabi:armv7a-linux-androideabi \
            i686-linux-android:i686-linux-android \
            x86_64-linux-android:x86_64-linux-android; do
            triple="${abi%%:*}"
            prefix="${abi##*:}"
            key="${triple//-/_}"
            upper="$(echo "$key" | tr '[:lower:]' '[:upper:]')"
            {
              echo "CC_${key}=$TOOLCHAIN/bin/${prefix}${API}-clang"
              echo "CXX_${key}=$TOOLCHAIN/bin/${prefix}${API}-clang++"
              echo "AR_${key}=$TOOLCHAIN/bin/llvm-ar"
              echo "CARGO_TARGET_${upper}_LINKER=$TOOLCHAIN/bin/${prefix}${API}-clang"
              echo "BINDGEN_EXTRA_CLANG_ARGS_${key}=--sysroot=$TOOLCHAIN/sysroot --target=${prefix}${API}"
            } >> "$GITHUB_ENV"
          done

      - name: Configure release signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" "$KEY_PASSWORD" "$RUNNER_TEMP/upload.jks" \
            > src-tauri/gen/android/keystore.properties

      - name: Build APK
        # NDK + JDK 17 are preinstalled on GitHub runners — using them avoids
        # adding new (unpinned) actions to a workflow that holds signing keys.
        # This builds every ABI, 32-bit included, so the bindgen env above has
        # to cover all four.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          pnpm tauri android build --apk

      - name: Upload APK to draft release
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          case "$APK" in
            *unsigned*) NAME="md-specpad_${TAG#v}-unsigned.apk" ;;
            *)          NAME="md-specpad_${TAG#v}.apk" ;;
          esac
          cp "$APK" "$NAME"
          gh release upload "$TAG" "$NAME" --repo '${{ github.repository }}'

  # Attestations + checksums run over the assembled draft release so every
  # asset is covered in one place, regardless of which runner built it.
  finalize:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Via env, not inline interpolation, so a hostile ref name can't inject
      # into the shell.
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download all release assets
        run: gh release download "$TAG" --repo '${{ github.repository }}' --dir assets

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: assets/*

      - name: Order release assets (installers first, support files last)
        run: |
          # Checksums over the originals; write to parent so `*` can't self-include.
          (cd assets && sha256sum *) > SHA256SUMS
          cp SHA256SUMS assets/
          cd assets
          rank() {
            case "$1" in
              *-setup.exe)  echo 10 ;;   # Windows installer
              *.dmg)        echo 20 ;;   # macOS installer
              *.deb)        echo 30 ;;   # Linux Debian/Ubuntu
              *.AppImage)   echo 40 ;;   # Linux
              *.rpm)        echo 50 ;;   # Linux Fedora/RHEL
              *.apk)        echo 52 ;;   # Android
              *.app.tar.gz) echo 60 ;;   # macOS updater bundle
              latest.json)  echo 70 ;;
              *.sig)        echo 80 ;;   # all signatures (incl. *.app.tar.gz.sig)
              SHA256SUMS)   echo 90 ;;
              *)            echo 55 ;;   # unknown -> after installers, before support
            esac
          }
          # Re-upload in ascending rank; --clobber resets created_at so the final
          # upload order == the display order on the release page. Tab-delimited
          # so the spaces in "MD Specpad_..." filenames survive sort/read.
          for f in *; do printf '%s\t%s\n' "$(rank "$f")" "$f"; done \
            | sort -n -k1,1 -s | cut -f2- \
            | while IFS= read -r f; do
                gh release upload "$TAG" "$f" --repo '${{ github.repository }}' --clobber
              done

      # GitHub always renders the notes above the Assets box, and offers no way
      # to reorder the page — so the only way to put downloads first is to put
      # links IN the notes. Built here, not in the releaseBody template, because
      # this is the job that knows the real filenames. The links 404 until the
      # draft is published; that is expected.
      - name: Put download links at the top of the release notes
        run: |
          BASE='${{ github.server_url }}/${{ github.repository }}/releases/download'
          # $1 is a glob, deliberately unquoted so the shell expands it. A glob
          # rather than ls: ls decorates names on some platforms.
          link() {
            for f in assets/$1; do
              [ -e "$f" ] || continue
              f="${f#assets/}"
              printf '[%s](%s/%s/%s)' "$f" "$BASE" "$TAG" "$(jq -rn --arg s "$f" '$s|@uri')"
              return
            done
            printf '_not built_'
          }
          gh release view "$TAG" --repo '${{ github.repository }}' --json body -q .body > old-body.md
          if head -n 1 old-body.md | grep -q '^## Download'; then
            echo "notes already carry a download table — nothing to do"
            exit 0
          fi
          {
            echo '## Download'
            echo
            echo '| Your computer | File |'
            echo '| --- | --- |'
            echo "| 🪟 **Windows** | $(link '*-setup.exe') |"
            echo "| 🤖 **Android** | $(link '*.apk') |"
            echo "| 🍎 **macOS** (Intel & Apple Silicon) | $(link '*.dmg') |"
            echo
            cat old-body.md
          } > body.md
          gh release edit "$TAG" --repo '${{ github.repository }}' --notes-file body.md
