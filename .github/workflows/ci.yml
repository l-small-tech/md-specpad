# CI gate. A milestone is not done with a red matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check # tsc --noEmit && eslint && prettier --check
      - run: pnpm test

  rust-and-build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the oldest supported glibc for Linux builds;
        # if GitHub retires the runner image, move to ubuntu-24.04.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux webview dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      # whisper-rs (offline voice notes) builds whisper.cpp with CMake and
      # generates its bindings with libclang. CMake is on every runner image;
      # libclang is not on Linux. Windows and macOS images ship LLVM, but
      # bindgen only finds it when told where.
      - name: Install libclang (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y cmake libclang-dev
      - name: Point bindgen at LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
        shell: bash
      # Xcode's own toolchain, not brew's: `brew --prefix llvm` answers with a
      # prefix even when the formula is not installed, and the runner images
      # stopped shipping it — bindgen then died on "Unable to find libclang".
      - name: Point bindgen at LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$LIB/libclang.dylib" || { echo "::error::no libclang.dylib in $LIB"; exit 1; }
          echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
      # The Vulkan backend (Windows/Linux) compiles its shaders with glslc
      # from the Vulkan SDK at build time; the app itself needs only the
      # platform's Vulkan loader (delay-loaded on Windows). macOS uses Metal
      # and needs nothing extra.
      # LunarG's own silent install, not a third-party action: the action
      # unpacks the installer with 7-Zip, and the current SDK's installer
      # yields only bin/ that way — CMake's FindVulkan then fails on the
      # missing Include/ and Lib/. `--root` keeps the SDK path short.
      - name: Install Vulkan SDK (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP/vulkan_sdk.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $exe
          $sdkArgs = @('--root', 'C:/VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          Start-Process -FilePath $exe -ArgumentList $sdkArgs -NoNewWindow -Wait
          foreach ($f in 'Bin/glslc.exe', 'Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib') {
            if (-not (Test-Path "C:/VulkanSDK/$f")) { throw "Vulkan SDK install is missing $f" }
          }
          "VULKAN_SDK=C:/VulkanSDK" >> $env:GITHUB_ENV
          "C:/VulkanSDK/Bin" >> $env:GITHUB_PATH
      # jammy has no `glslc` package (it arrives in 24.04), so glslc comes from
      # LunarG's own apt repo; the loader and headers still come from Ubuntu.
      - name: Install Vulkan headers + glslc (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          KEY=https://packages.lunarg.com/lunarg-signing-key-pub.asc
          LIST=https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          wget -qO- "$KEY" | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list "$LIST"
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-headers shaderc
          glslc --version
          test -f /usr/include/vulkan/vulkan.h
      # The shader generator is a nested CMake project ~150 characters deep
      # inside the target dir; MSVC's build tooling still stops at MAX_PATH,
      # so Windows builds from a short target dir (see README "Build notes").
      - name: Short target dir (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "CARGO_TARGET_DIR=D:\t" >> "$GITHUB_ENV"
        shell: bash

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds ../dist at compile time; the Rust
      # crate cannot even typecheck without a frontend build present.
      - run: pnpm run build

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # Debug build (no bundling) proves the webview stack links on each OS.
      - name: cargo build (link smoke test)
        run: cargo build
        working-directory: src-tauri

  # Compiles the #[cfg(target_os = "android")] half of the crate (saf_*/stt_*
  # commands, tauri-plugin-androidfs) — nothing else in CI touches that code.
  # whisper-rs is in the Android graph too (CPU only), so this job also needs
  # CMake + libclang and a C/C++ cross-compiler the cmake crate can find.
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # armv7 as well as arm64: whisper-rs-sys falls back to PREBUILT (64-bit)
      # bindings when bindgen fails, which only blows up on a 32-bit ABI — the
      # v0.8.0 APK build died on `24_usize - 48_usize` overflows that an
      # arm64-only check cannot see.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: android-check

      - run: pnpm install --frozen-lockfile

      - name: Install cmake + libclang (whisper-rs bindings)
        run: sudo apt-get install -y cmake libclang-dev

      # generate_context! embeds ../dist even for `cargo check`.
      - run: pnpm run build

      # whisper-rs-sys builds whisper.cpp with CMake even for `cargo check`,
      # so the NDK compilers are needed for real here, not just as a probe.
      # Deliberately NOT the NDK's android.toolchain.cmake: that file picks its
      # own default ABI (armeabi-v7a) unless ANDROID_ABI is passed as a CMake
      # argument, which the cmake crate offers no env hook for — the v0.8.0 APK
      # got 32-bit whisper objects for every ABI and failed to link with
      # "incompatible with aarch64linux". Without it the cmake crate sets
      # CMAKE_SYSTEM_NAME=Android and CMAKE_SYSTEM_PROCESSOR per target and
      # CMake derives the right ABI. bindgen separately needs the NDK sysroot
      # and the target triple, or it reads the HOST headers and silently falls
      # back to whisper-rs-sys's prebuilt 64-bit bindings.
      - name: Export NDK toolchain env
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          API=24
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # <rust target>:<clang prefix> — armv7's compiler wrapper is spelled
          # armv7a-linux-androideabi, not armv7-linux-androideabi.
          for abi in aarch64-linux-android:aarch64-linux-android \
            armv7-linux-androideabi:armv7a-linux-androideabi; do
            triple="${abi%%:*}"
            prefix="${abi##*:}"
            key="${triple//-/_}"
            upper="$(echo "$key" | tr '[:lower:]' '[:upper:]')"
            {
              echo "CC_${key}=$TOOLCHAIN/bin/${prefix}${API}-clang"
              echo "CXX_${key}=$TOOLCHAIN/bin/${prefix}${API}-clang++"
              echo "AR_${key}=$TOOLCHAIN/bin/llvm-ar"
              echo "CARGO_TARGET_${upper}_LINKER=$TOOLCHAIN/bin/${prefix}${API}-clang"
              echo "BINDGEN_EXTRA_CLANG_ARGS_${key}=--sysroot=$TOOLCHAIN/sysroot --target=${prefix}${API}"
            } >> "$GITHUB_ENV"
          done

      # `cargo build --lib`, not `cargo check`: a check never LINKS, and the
      # whisper ABI mismatch that broke the v0.8.0 APK is a link-time error.
      # The link args are the ones tauri's own android build passes.
      - name: cargo build (Android ABIs)
        run: |
          cargo build --lib --target aarch64-linux-android
          cargo build --lib --target armv7-linux-androideabi
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings -Clink-arg=-landroid -Clink-arg=-llog -Clink-arg=-lOpenSLES

  # EXPERIMENTAL, NON-GATING e2e smoke test: WebdriverIO drives the real debug
  # exe through tauri-driver (launch → type → relaunch → session restore).
  # continue-on-error because tauri-driver is pre-alpha and the WebDriver +
  # WebView2 stack can flake on hosted runners — a red run here must never
  # block a merge. If this job flakes for ~2 weeks straight, delete it.
  # The smoke test persists real session state to the runner's appdata dir;
  # that's acceptable only because CI runners are throwaway.
  e2e-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # whisper-rs needs libclang for its bindings and the Vulkan SDK for its
      # shaders (see rust-and-build). The debug exe must land where
      # e2e/wdio.conf.ts looks (src-tauri/target), so no short target dir
      # here — this job is non-gating, and the path is a few characters
      # inside MAX_PATH on the hosted runner.
      - name: Point bindgen at LLVM
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
        shell: bash
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP/vulkan_sdk.exe"
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $exe
          $sdkArgs = @('--root', 'C:/VulkanSDK', '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          Start-Process -FilePath $exe -ArgumentList $sdkArgs -NoNewWindow -Wait
          "VULKAN_SDK=C:/VulkanSDK" >> $env:GITHUB_ENV
          "C:/VulkanSDK/Bin" >> $env:GITHUB_PATH

      # Same MAX_PATH trap as rust-and-build: the shader generator builds ~150
      # characters below the target dir. wdio takes the exe's real path from
      # TAURI_APP_BIN (e2e/wdio.conf.ts) instead of assuming src-tauri/target.
      - name: Short target dir
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
          echo "TAURI_APP_BIN=D:/t/debug/md-specpad.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: e2e-windows # distinct from rust-and-build's windows cache

      - run: pnpm install --frozen-lockfile

      # generate_context! embeds ../dist at compile time — the frontend build
      # must precede any cargo command (CLAUDE.md "Build order").
      - run: pnpm run build

      # Builds the exe the wdio capabilities point tauri-driver at:
      # src-tauri/target/debug/md-specpad.exe (see e2e/wdio.conf.ts).
      - name: cargo build (app under test)
        run: cargo build
        working-directory: src-tauri

      # rust-cache caches target/, not cargo-installed binaries, so cache the
      # tauri-driver exe separately. The fixed key pins whatever version was
      # cached first — acceptable staleness for a non-gating job vs. paying
      # the ~2 min `cargo install` compile every run. Bump the -v1 suffix to
      # force a fresh install (e.g. to pick up a new tauri-driver release).
      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-v1

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      # tauri-driver proxies to a native WebDriver server; on Windows that is
      # msedgedriver, which must match the installed Edge (WebView2) major
      # version. Read the version off the Edge exe shipped in the runner image
      # and download the matching driver, falling back to the newest published
      # driver of the same major if that exact build was never published.
      # TAURI_NATIVE_DRIVER is consumed by e2e/wdio.conf.ts when it spawns
      # tauri-driver (--native-driver).
      - name: Download matching msedgedriver
        shell: pwsh
        run: |
          $edgeExe = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgeExe)) {
            $edgeExe = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          }
          $version = (Get-Item $edgeExe).VersionInfo.ProductVersion
          Write-Host "Edge version: $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          } catch {
            # No driver published for that exact build; ask the LATEST_RELEASE
            # endpoint for the same major. It answers UTF-16LE text with a BOM.
            $major = $version.Split('.')[0]
            $resp = Invoke-WebRequest "https://msedgedriver.microsoft.com/LATEST_RELEASE_${major}_WINDOWS"
            if ($resp.Content -is [byte[]]) {
              $fallback = [System.Text.Encoding]::Unicode.GetString($resp.Content)
            } else {
              $fallback = [string]$resp.Content
            }
            $fallback = $fallback.Trim([char]0xFEFF).Trim()
            Write-Host "Exact $version not published; falling back to $fallback"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$fallback/edgedriver_win64.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          if (-not (Test-Path $driver)) { throw "msedgedriver.exe missing after extraction" }
          "TAURI_NATIVE_DRIVER=$driver" >> $env:GITHUB_ENV

      # wdio's onPrepare hook spawns tauri-driver itself (and kills it in
      # onComplete), so this one command is the whole test run.
      - run: pnpm run e2e
