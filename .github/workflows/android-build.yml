# Full Android APK build. Not a PR gate (android-check in ci.yml is the fast
# gate) — this catches Gradle/Kotlin/NDK breakage, which changes rarely.
name: Android build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # v3's default `packages` was "tools platform-tools", and the legacy
      # `tools` package is gone from cmdline-tools 16.0's repository: sdkmanager
      # exited 1 and the job died here every week from 2026-09-21. v4 defaults
      # to platform-tools alone; keep it explicit so a future default can't
      # bring the failure back.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: android-apk

      - run: pnpm install --frozen-lockfile

      # Same stale-cache guard as android-check in ci.yml: a cached
      # CMakeCache.txt naming another compiler makes CMake drop
      # whisper-rs-sys's -D defines and fail on the missing tests/ dir.
      - name: Drop stale whisper.cpp CMake caches
        run: rm -f src-tauri/target/*/*/build/whisper-rs-sys-*/out/build/CMakeCache.txt

      - name: Build debug APK
        run: pnpm tauri android build --debug --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-universal-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
